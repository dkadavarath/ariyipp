name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-build:
    name: Unit tests + builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug builds
        run: ./gradlew :shared:test :app:testDebugUnitTest :sender:testDebugUnitTest :app:assembleDebug :sender:assembleDebug

      - name: Release build (R8 full mode, unsigned)
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on API 30 ATD emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest :sender:connectedDebugAndroidTest

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
